name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure native build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build native examples
        run: cmake --build build --parallel

      - name: Run native tests
        run: ctest --test-dir build --output-on-failure

      - name: Compile and test Java
        run: cmake --build build --target java-test

      - name: Check formatting
        run: ./scripts/check-format.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          if-no-files-found: ignore

  sanitizers:
    name: Native sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS=-fsanitize=address,undefined
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build sanitized native examples
        run: cmake --build build-sanitized --parallel

      - name: Run sanitized native tests
        run: ctest --test-dir build-sanitized --output-on-failure
